<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortic - Instant Digital Delivery</title>
  <meta name="description"
    content="Instant delivery, secure checkout for digital goods. Gaming items delivered instantly.">
  <meta name="author" content="Vortic">

  <meta property="og:title" content="Vortic - Instant Digital Delivery">
  <meta property="og:description"
    content="Instant delivery, secure checkout for digital goods. Gaming items delivered instantly.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@lovable_dev">
  <meta name="twitter:image" content="">

  <style>
    /* Vortic Gaming Shop Design System - Dark theme with red accents */

    :root {
      /* Gaming dark theme with red accents */
      --background: hsl(0, 0%, 6%);
      --background-gradient: radial-gradient(ellipse at center, hsl(0, 0%, 8%) 0%, hsl(0, 0%, 4%) 100%);
      --foreground: hsl(0, 0%, 95%);

      /* Card system for consistent layout */
      --card: hsl(0, 0%, 10%);
      --card-foreground: hsl(0, 0%, 95%);
      --card-radius: 22px;

      /* Vortic red accent system */
      --accent-red: hsl(0, 75%, 55%);
      --accent-red-hover: hsl(0, 75%, 50%);

      /* Navigation and interactive elements */
      --nav-active: hsl(0, 75%, 55%);
      --nav-inactive: hsl(0, 0%, 60%);

      /* Muted text and secondary elements */
      --muted: hsl(0, 0%, 60%);
      --muted-foreground: hsl(0, 0%, 60%);

      /* Input and form elements */
      --input: hsl(0, 0%, 15%);
      --input-border: hsl(0, 0%, 25%);

      /* Button variants */
      --button-primary: hsl(0, 75%, 55%);
      --button-primary-hover: hsl(0, 75%, 50%);
      --button-primary-foreground: hsl(0, 0%, 100%);

      --button-ghost: transparent;
      --button-ghost-hover: hsl(0, 0%, 15%);
      --button-ghost-foreground: hsl(0, 0%, 95%);

      --button-outline: transparent;
      --button-outline-border: hsl(0, 0%, 30%);
      --button-outline-hover: hsl(0, 0%, 15%);
      --button-outline-foreground: hsl(0, 0%, 70%);

      /* Layout constraints */
      --container-max: 980px;

      /* Shadows and effects */
      --shadow-card: 0 4px 20px hsl(0, 0%, 0%, 0.3);

      /* Typography scale */
      --text-hero: 2.75rem;
      /* 44px */
      --text-hero-mobile: 2rem;
      /* 32px */
      --text-large: 1.5rem;

      /* Animation system */
      --transition-fast: 0.15s ease-out;
      --transition-normal: 0.3s ease-out;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--background);
      background-image: var(--background-gradient);
      color: var(--foreground);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Navigation */
    .nav {
      width: 100%;
      border-bottom: 1px solid var(--input-border);
      background: hsl(0 0% 10% / .5);
      backdrop-filter: blur(8px);
    }

    .nav-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .brand .accent {
      color: var(--accent-red);
    }

    .nav-links {
      display: flex;
      gap: .5rem;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: .75rem 1.5rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: .875rem;
      text-transform: uppercase;
      letter-spacing: .025em;
      border: none;
      cursor: pointer;
      transition: all var(--transition-normal);
      text-decoration: none;
      min-height: 2.75rem;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--button-primary);
      color: var(--button-primary-foreground);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--button-primary-hover);
    }

    .btn-ghost {
      background: var(--button-ghost);
      color: var(--button-ghost-foreground);
      border: 1px solid transparent;
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--button-ghost-hover);
    }

    .btn-outline {
      background: var(--button-outline);
      color: var(--button-outline-foreground);
      border: 1px solid var(--button-outline-border);
    }

    .btn-outline:hover:not(:disabled) {
      background: var(--button-outline-hover);
    }

    .btn-nav {
      background: transparent;
      color: var(--nav-inactive);
      border: 1px solid transparent;
      padding: .5rem 1rem;
    }

    .btn-nav.active {
      background: var(--nav-active);
      color: #fff;
    }

    .btn-disabled {
      background: var(--input-border);
      color: var(--muted);
      cursor: not-allowed;
    }

    .btn-full {
      width: 100%;
    }


    /* Cards */
    .card {
      background: var(--card);
      color: var(--card-foreground);
      border-radius: var(--card-radius);
      padding: 2rem;
      border: 1px solid var(--input-border);
      box-shadow: var(--shadow-card);
    }

    .card-lg {
      padding: 3rem;
    }

    /* Main */
    .main {
      flex: 1;
      padding: 2rem 0;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
      animation: fadeIn .3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Typography */
    .hero-title {
      font-size: var(--text-hero);
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    @media (max-width:768px) {
      .hero-title {
        font-size: var(--text-hero-mobile);
      }
    }

    .large-title {
      font-size: var(--text-large);
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .subtitle {
      font-size: 1.25rem;
      color: var(--muted-foreground);
      margin-bottom: 2rem;
      text-align: center;
    }

    .text-muted {
      color: var(--muted-foreground);
    }

    .text-accent {
      color: var(--accent-red);
    }

    /* Utilities */
    .space-y-6>*+* {
      margin-top: 1.5rem;
    }

    .space-y-4>*+* {
      margin-top: 1rem;
    }

    .text-center {
      text-align: center;
    }

    .max-w-2xl {
      max-width: 42rem;
      margin: 0 auto;
    }

    .max-w-md {
      max-width: 28rem;
      margin: 0 auto;
    }

    /* Grouped product layout (category sections) */
    .group-block {
      margin-bottom: 2rem;
    }

    .group-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 1rem 0;
    }

    .group-grid {
      display: grid;
      gap: 1rem;
    }

    @media (min-width:640px) {
      .group-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width:1024px) {
      .group-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    /* ---------------- Product list (clean + aligned) ---------------- */
    .product-item {
      background: var(--card);
      border-radius: 16px;
      padding: 1.25rem 1.25rem;
      border: 1px solid var(--input-border);
      box-shadow: var(--shadow-card);
      transition: border-color var(--transition-normal);
      overflow: hidden;
    }

    .product-item:hover {
      border-color: var(--muted-foreground);
    }

    /* === Revert to the classic grid layout, but allow full title === */
    .product-content {
      display: grid !important;
      grid-template-columns: 1fr auto !important;
      gap: .875rem !important;
      /* a bit tighter */
      align-items: start !important;
    }

    /* Show full product names (no clamp/ellipsis) */
    .product-name {
      display: block !important;
      -webkit-line-clamp: unset !important;
      -webkit-box-orient: initial !important;
      overflow: visible !important;
      white-space: normal !important;
      text-overflow: clip !important;
      min-height: 0 !important;
    }

    /* Smaller, tighter card */
    .product-item {
      padding: 1rem 1rem !important;
      /* was ~1.25–1.5rem */
      border-radius: 14px !important;
      /* a touch smaller */
    }

    /* Keep price + BUY aligned at top/right */
    .product-actions {
      align-self: start !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .4rem;
      min-width: 7.5rem;
      /* keeps column steady */
    }

    /* Price a bit smaller to save vertical space */
    .price-box {
      font-size: 1rem !important;
      /* was 1.125rem */
      font-weight: 700;
      text-align: center;
    }

    /* Compact badges */
    .badges {
      gap: .4rem !important;
    }

    .badge {
      padding: .2rem .5rem !important;
      font-size: .72rem !important;
      border-radius: 999px;
    }

    /* Compact Buy button */
    .buy-btn {
      width: 7.5rem !important;
      /* a bit narrower */
      padding: .45rem .9rem !important;
      border-radius: 14px !important;
      font-size: .8rem !important;
    }

    /* Slightly smaller group spacing (optional) */
    .group-grid {
      gap: .875rem !important;
    }

    .product-info {
      min-width: 0;
    }

    /* Title: tidy spacing + consistent height */
    .product-name {
      font-size: var(--text-large);
      font-weight: 600;
      margin: 0 0 .35rem 0;
      line-height: 1.2;
      overflow: visible;
      white-space: normal;
      /* allow wrapping */
      display: block;
      /* remove line clamp behavior */
      min-height: auto;


      /* normalize to 2 lines so cards stay even */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: calc(1.2em * 2);
    }

    /* Old detail row not used now */
    .product-details {
      display: none;
    }

    /* Price text (used in price-box too) */
    .product-price,
    .price-box {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--foreground);
      text-align: center;
    }

    /* Actions column pinned to top */
    .product-actions {
      align-self: start !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .5rem;
    }

    /* Button sizing/anchor look */
    .buy-btn {
      width: 8rem;
      display: inline-flex;
      justify-content: center;
      text-decoration: none;
    }

    /* Metadata row (price + chips), if you use it */
    .meta-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: .75rem;
      flex-wrap: wrap;
    }

    /* Kill the vertical divider everywhere */
    .separator {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
      margin: 0 !important;
    }

    .product-price {
      font-size: 1rem;
      font-weight: 700;
      color: var(--foreground);
    }

    .badges {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .25rem .55rem;
      border-radius: 999px;
      background: var(--input);
      border: 1px solid var(--input-border);
      color: var(--muted-foreground);
      font-size: .75rem;
      line-height: 1;
    }

    .badge .dot {
      width: .5rem;
      height: .5rem;
      border-radius: 50%;
      display: inline-block;
    }

    .badge--account .dot {
      background: var(--accent-red);
    }

    .badge--giftcard .dot {
      background: var(--accent-red);
      opacity: .7;
    }

    .badge--live .dot {
      background: var(--accent-red);
    }

    .badge .value {
      color: var(--foreground);
      font-weight: 600;
    }

    /* action area */
    .product-actions {
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .btn-sm {
      padding: .5rem 1rem;
      border-radius: 1rem;
      font-size: .75rem;
    }

    /* kill the vertical divider for good */
    .separator {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    /* optional: soften card hover */
    .product-item:hover {
      border-color: hsl(0 0% 35% / .6);
    }

    .product-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .35rem;
      flex-shrink: 0;
      min-width: 8rem;
    }

    .checkout-note {
      color: var(--muted-foreground);
      white-space: nowrap;
      line-height: 1;
      font-size: .875rem;
      display: none;
    }

    @media (min-width:640px) {
      .checkout-note {
        display: inline;
      }
    }

    .stock-number {
      color: var(--accent-red);
    }

    /* Price + button vertical stack */
    .product-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .5rem;
    }

    .price-box {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--foreground);
      text-align: center;
    }

    /* Buy-Now button style */
    .buy-btn {
      width: 100%;
      max-width: 8rem;
      font-weight: 600;
      letter-spacing: .03em;
    }


    /* Forms */
    .form-group {
      margin-bottom: 1rem;
    }

    .label {
      display: block;
      font-size: .875rem;
      font-weight: 500;
      margin-bottom: .5rem;
    }

    .input {
      width: 100%;
      height: 3rem;
      padding: .75rem 1rem;
      border-radius: var(--card-radius);
      border: 1px solid var(--input-border);
      background: var(--input);
      color: var(--foreground);
      font-size: 1rem;
      transition: border-color var(--transition-fast);
    }

    .input:focus {
      outline: none;
      border-color: var(--accent-red);
    }

    .input:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* Status */
    .status-message {
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--input);
      border-radius: var(--card-radius);
      border: 1px solid var(--input-border);
      text-align: center;
    }

    /* Footer */
    .footer {
      width: 100%;
      border-top: 1px solid var(--input-border);
      background: hsl(0 0% 10% / .3);
      backdrop-filter: blur(8px);
      margin-top: 3rem;
    }

    .footer-content {
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .footer-copyright {
      color: var(--muted-foreground);
      margin-bottom: 1rem;
    }

    .social-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      color: var(--accent-red);
      text-decoration: none;
      font-weight: 500;
      transition: color var(--transition-fast);
    }

    .social-link:hover {
      color: var(--accent-red-hover);
    }

    .social-icon {
      font-size: 1.125rem;
    }

    .external-icon {
      width: .75rem;
      height: .75rem;
    }

    /* Responsive tweaks for small screens */
    @media (max-width:640px) {
      .nav-content {
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }

      .nav-links {
        width: 100%;
        justify-content: center;
      }

      .btn-full-mobile {
        width: 100%;
      }
    }

    /* Slightly larger default sizing on desktop */
    @media (min-width: 1024px) {
      html {
        font-size: 17px;
      }

      /* was browser default ~16px */
      :root {
        --container-max: 1120px;
      }

      /* was 980px */
    }

    /* If you ever want an even bigger look, toggle this class on <body> */
    body.ui-xl {
      --container-max: 1280px;
    }

    @media (min-width: 1024px) {
      body.ui-xl {
        font-size: 18px;
      }
    }

    /* Global thin scrollbar (Firefox) */
    * {
      scrollbar-width: thin;
      scrollbar-color: hsl(0 0% 30%) transparent;
    }

    /* WebKit (Chrome/Edge/Safari) — global default */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: linear-gradient(180deg, transparent, hsl(0 0% 10% / .4) 40%, transparent);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, hsl(0 0% 35%), hsl(0 0% 25%));
      border-radius: 999px;
      border: 2px solid transparent;
      /* “pill” look */
      background-clip: content-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, hsl(0 0% 45%), hsl(0 0% 35%));
    }

    /* Make the Products page scrollbar a bit more pronounced */
    #products::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, hsl(0 0% 45%), hsl(0 0% 30%));
    }

    #products {
      scrollbar-color: hsl(0 0% 45%) transparent;
    }

    /* Firefox */

    .buy-btn {
      display: inline-flex;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-content container">
      <div class="brand">
        <span>Vortic</span>
      </div>
      <div class="nav-links">
        <button class="btn btn-nav active" onclick="switchTab('home')">Home</button>
        <button class="btn btn-nav" onclick="switchTab('products')">Products</button>
        <button class="btn btn-nav" onclick="switchTab('redeem')">Redeem</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main">
    <div class="container">
      <!-- Home Section -->
      <div id="home" class="section active">
        <div class="card card-lg">
          <div class="max-w-2xl">
            <h1 class="hero-title">
              Welcome to <span class="text-accent">Vortic</span>
            </h1>

            <p class="subtitle">
              Vortic — The Ultimate In-Game Currency Hub.
            </p>

            <div class="flex flex-col gap-4 max-w-md">
              <button class="btn btn-primary btn-full" onclick="switchTab('products')">
                View Products
              </button>
              <button class="btn btn-ghost btn-full" onclick="switchTab('redeem')">
                Redeem
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Products Section -->
      <div id="products" class="section">
        <div class="space-y-6">
          <!-- Hero Card -->
          <div class="card">
            <div class="text-center">
              <h1 class="hero-title">Products</h1>
              <p class="subtitle">
                Live stock preview. Use Redeem to complete your order.
              </p>
            </div>
          </div>

          <!-- Products Grid -->
          <div class="grid" id="products-list">
            <!-- Products will be populated by JavaScript -->
          </div>
        </div>
      </div>

      <!-- Redeem Section -->
      <div id="redeem" class="section">
        <div class="space-y-6">
          <!-- Hero Card -->
          <div class="card">
            <div class="text-center">
              <h1 class="hero-title">Redeem</h1>
              <p class="subtitle">
                Check your invoice and redeem your item.
              </p>
            </div>
          </div>

          <!-- Redeem Card -->
          <div class="card max-w-2xl">
            <div class="space-y-6">
              <div class="text-center">
                <h2 class="large-title">Redeem your purchase</h2>
                <p class="text-muted">
                  Enter your invoice ID.
                </p>
              </div>

              <div class="space-y-4">
                <div class="form-group">
                  <label for="invoice" class="label">Invoice ID *</label>
                  <input id="invoice" type="text""
              class=" input" />
                </div>
                <!-- SKU field removed -->
              </div>

              <div class="flex gap-4 flex-col-mobile">
                <button class="btn btn-primary btn-full-mobile" onclick="checkInvoice()">
                  Check
                </button>
                <button class="btn btn-ghost btn-full-mobile" onclick="redeemInvoice()">
                  Redeem
                </button>
              </div>

              <!-- Status Message -->
              <div id="status" class="status-message" style="display: none;">
                <p id="status-text"></p>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content container">
      <p class="footer-copyright">
        © 2025 Vortic — Instant digital delivery
      </p>

      <div class="social-links">
        <a href="https://vortic.mysellauth.com" class="social-link" target="_blank" rel="noopener noreferrer">
          <span class="social-icon">🛒</span><span>Auto Buy</span><span class="external-icon">↗</span>
        </a>
        <a href="https://t.me/vortic_exe" class="social-link" target="_blank" rel="noopener noreferrer">
          <span class="social-icon">📱</span><span>Telegram</span><span class="external-icon">↗</span>
        </a>
      </div>
    </div>
  </footer>

  <script>

    // === Autobuy config ===
    // clean local route
    const AUTO_BUY_BASE = "/buy";

    function buyUrlFor(p) {
      const id = p.id ?? p.sku ?? p.name;
      return `${AUTO_BUY_BASE}/${encodeURIComponent(id)}`;  // goes to your server first
    }

    let isLoading = false;
    let currentTab = 'home';

    // ---- Tabs ----
    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      const active = document.getElementById(tabName);
      if (active) active.classList.add('active');

      document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
      const btn = Array.from(document.querySelectorAll('.btn-nav'))
        .find(b => b.textContent.toLowerCase() === tabName);
      if (btn) btn.classList.add('active');
    }

    // ---- Load grouped products from server ----
    async function loadProducts() {
      const container = document.getElementById('products-list');
      container.innerHTML = `<div class="text-muted">Loading products…</div>`;

      try {
        const res = await fetch('/api/products', { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Failed to fetch products');

        renderGroupedProducts(data.groups || {});
      } catch (err) {
        console.error('loadProducts failed:', err);

        // Fallback: /api/stock -> group as "Demo"
        try {
          const r = await fetch('/api/stock', { cache: 'no-store' });
          const d = await r.json();
          const groups = {
            Demo: (d.items || []).map(p => ({
              id: p.sku || p.name,
              name: p.name,
              sku: p.sku,
              price: p.price,
              liveStock: p.stock,
            }))
          };
          renderGroupedProducts(groups);
        } catch {
          container.innerHTML = `<div class="status-message">Couldn’t load products.</div>`;
        }
      }
    }

    function renderGroupedProducts(groups) {
      const outer = document.getElementById('products-list');
      outer.innerHTML = '';

      Object.entries(groups).forEach(([groupName, items]) => {
        const block = document.createElement('section');
        block.className = 'group-block';
        block.innerHTML = `
      <h2 class="group-title">${escapeHtml(groupName || 'Products')}</h2>
      <div class="group-grid"></div>
    `;
        const grid = block.querySelector('.group-grid');

        (items || []).forEach(p => {
          const id = p.id ?? p.sku ?? p.name ?? Math.random().toString(36).slice(2);
          const hasBuckets = p?.stock && typeof p.stock.account === 'number' && typeof p.stock.giftcard === 'number';

          const account = hasBuckets ? Math.max(0, Number(p.stock.account)) : null;
          const giftcard = hasBuckets ? Math.max(0, Number(p.stock.giftcard)) : null;
          const live = !hasBuckets ? Math.max(0, Number(p.liveStock ?? p.stock ?? 0)) : (account + giftcard);

          const inStock = live > 0;
          const priceStr = p.price != null ? Number(p.price).toFixed(2) : '—';

          const badgesHtml = hasBuckets
            ? `
          <span class="badge badge--account"><span class="dot"></span>Account <span class="value">${account}</span></span>
          <span class="badge badge--giftcard"><span class="dot"></span>Giftcard <span class="value">${giftcard}</span></span>
        `
            : `<span class="badge badge--live"><span class="dot"></span>Stock <span class="value">${live}</span></span>`;

          const btnCls = inStock ? 'btn-outline btn-sm buy-btn' : 'btn-disabled btn-sm buy-btn';
          const btnTxt = inStock ? 'BUY NOW' : 'SOLD OUT';
          const buyUrl = buyUrlFor(p);

          const card = document.createElement('div');
          card.className = 'product-item';
          if (!hasBuckets) {
            card.dataset.baseStock = String(live);
            card.dataset.currentStock = String(live);
          }
          card.dataset.hasBuckets = hasBuckets ? '1' : '0';

          card.innerHTML = `
        <div class="product-content">
          <div class="product-info">
            <h3 class="product-name">${escapeHtml(p.name || 'Product')}</h3>
            <div class="badges" style="margin:.5rem 0;">${badgesHtml}</div>
          </div>
          <div class="product-actions">
            <div class="price-box">$${priceStr}</div>
            ${inStock
              ? `<a class="btn ${btnCls}" href="${buyUrl}" target="_blank" rel="noopener">${btnTxt}</a>`
              : `<button class="btn ${btnCls}" disabled>${btnTxt}</button>`
            }
          </div>
        </div>
      `;

          grid.appendChild(card);
        });

        outer.appendChild(block);
      });

      startStockJitter();
    }
    // ---- Gentle random stock jitter (visual only) ----
    let jitterTimer = null;
    function startStockJitter() {
      if (jitterTimer) clearInterval(jitterTimer);

      const tick = () => {
        document.querySelectorAll('.product-item').forEach(card => {
          if (card.dataset.hasBuckets === '1') return; // keep currency counts exact

          const base = parseInt(card.dataset.baseStock || '0', 10);
          let cur = parseInt(card.dataset.currentStock || String(base), 10);
          if (!Number.isFinite(base)) return;

          const delta = Math.floor(Math.random() * 5) - 2; // -2..+2
          let next = Math.max(0, cur + delta);
          const cap = base + 6;
          if (next > cap) next = cap;

          card.dataset.currentStock = String(next);

          // update the live badge number
          const val = card.querySelector('.badge--live .value');
          if (val) val.textContent = String(next);
        });
      };

      // randomize the interval a bit for “natural” feeling
      jitterTimer = setInterval(tick, randBetween(20000, 45000));
      // also do an initial change after a short delay
      setTimeout(tick, 2000);
    }
    function randBetween(min, max) {
      return Math.floor(Math.random() * (max - min + 1) + min);
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // ---- Invoice check / redeem (unchanged) ----
    async function checkInvoice() {
      const invoiceInput = document.getElementById('invoice');
      const invoiceId = invoiceInput.value.trim();
      if (!invoiceId) return showStatus("❌ Missing Invoice ID");
      showStatus("Checking…");
      try {
        const res = await fetch(`/api/invoice/${encodeURIComponent(invoiceId)}`, { cache: 'no-store' });
        const data = await res.json();
        if (res.ok && data) {
          const status = (data.status || data?.data?.status || 'unknown').toString();
          showStatus(`✅ Invoice found! Status: ${status}`);
        } else {
          showStatus("❌ Invoice not found.");
        }
      } catch {
        showStatus("❌ Error contacting server.");
      }
    }

    async function redeemInvoice() {
      const invoiceInput = document.getElementById('invoice');
      const invoiceId = invoiceInput.value.trim();
      if (!invoiceId) return showStatus("❌ Missing Invoice ID");

      // Optional: you can pre-check status here. For now, just send to choose:
      window.location.href = `/choose/${encodeURIComponent(invoiceId)}`;
    }




    function showStatus(message) {
      const statusDiv = document.getElementById('status');
      const statusText = document.getElementById('status-text');
      statusText.textContent = message;
      statusDiv.style.display = 'block';
    }

    // ---- Init ----
    document.addEventListener('DOMContentLoaded', () => {
      loadProducts();
      switchTab('home');
    });
  </script>
